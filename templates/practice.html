<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Befunge Practice Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .grid-cell { width: 20px; height: 20px; border: 1px solid #333; text-align: center; font-family: monospace; font-size: 14px; cursor: default; }
        .grid-row { display: flex; }
        .highlight { background-color: #FFFF00; color: #000; font-weight: bold; transform: scale(1.1); transition: transform 0.1s; }
        .stack-item { border-bottom: 1px solid #444; padding: 2px 5px; font-family: monospace; font-size: 12px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-[#1a1a1a] text-[#ccc] font-sans h-screen flex flex-col p-4 box-border overflow-hidden">
    <div class="flex-1 flex flex-col min-h-0 mb-4 border-2 border-gray-700 bg-black rounded relative">
        <div class="absolute top-0 left-0 bg-gray-800 text-xs px-2 py-1 text-gray-400 font-bold z-10 border-b border-r border-gray-700">VISUAL MEMORY</div>
        <div id="grid-container" class="flex-1 overflow-auto p-2 pt-8"></div>
    </div>
    <div class="h-1/2 flex gap-4">
        <div class="w-1/3 flex flex-col border-2 border-gray-700 bg-gray-900 rounded">
            <div class="bg-gray-800 text-xs px-2 py-1 text-gray-400 font-bold border-b border-gray-700">SOURCE CODE</div>
            <textarea id="source-code" class="flex-1 bg-gray-900 text-green-400 p-2 font-mono resize-none focus:outline-none text-sm" spellcheck="false">v   "Enter Your Code Here" <
>                          ^
>  ,,,,,,,,,,,,,,,,,,,,,,@</textarea>
        </div>
        <div class="w-24 flex flex-col border-2 border-gray-700 bg-gray-900 rounded">
            <div class="bg-gray-800 text-xs px-2 py-1 text-gray-400 font-bold border-b border-gray-700 text-center">STACK</div>
            <div id="stack-view" class="flex-1 overflow-y-auto flex flex-col-reverse p-1"></div>
        </div>
        <div class="flex-1 flex flex-col gap-4">
            <div class="flex gap-2 items-center bg-gray-800 p-2 rounded border border-gray-700">
                <span class="text-xs font-bold text-blue-400 uppercase w-16">Input:</span>
                <input id="input-field" type="text" class="flex-1 bg-gray-900 border border-gray-600 text-white px-3 py-1 rounded focus:outline-none focus:border-blue-500 font-mono text-sm" placeholder="Type number/char here..." disabled>
                <button id="btn-submit-input" onclick="resolveInput()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1 rounded text-xs font-bold uppercase disabled:opacity-50 disabled:cursor-not-allowed" disabled>Send</button>
            </div>
            <div class="flex-1 flex flex-col border-2 border-gray-700 bg-black rounded relative">
                <div class="bg-gray-800 text-xs px-2 py-1 text-gray-400 font-bold border-b border-gray-700 flex justify-between"><span>CONSOLE OUTPUT</span><span id="status-indicator" class="text-gray-500">IDLE</span></div>
                <textarea id="output-box" class="flex-1 bg-black text-green-500 p-3 font-mono resize-none focus:outline-none text-sm leading-relaxed" readonly></textarea>
            </div>
            <div class="flex gap-2">
                <button id="btn-init" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-2 rounded font-bold border-b-4 border-gray-900 active:scale-[0.98] transition-all">RELOAD</button>
                <button id="btn-run" class="flex-1 bg-green-700 hover:bg-green-600 text-white py-2 rounded font-bold border-b-4 border-green-900 active:scale-[0.98] transition-all" disabled>▶ RUN</button>
                <button id="btn-step" class="flex-1 bg-yellow-700 hover:bg-yellow-600 text-white py-2 rounded font-bold border-b-4 border-yellow-900 active:scale-[0.98] transition-all" disabled>👣 STEP</button>
                <button id="btn-stop" class="flex-1 bg-red-700 hover:bg-red-600 text-white py-2 rounded font-bold border-b-4 border-red-900 active:scale-[0.98] transition-all" disabled>⏹ STOP</button>
            </div>
        </div>
    </div>
    <script>
        const ROWS = 25, COLS = 80;
        let grid = [], stack = [], pc = { x: 0, y: 0 }, dir = { x: 1, y: 0 }, running = false, stringMode = false, executionMode = 'manual', intervalId = null, pendingInputType = null;
        const delay = 50; 
        const gridContainer = document.getElementById('grid-container'), sourceCode = document.getElementById('source-code'), stackView = document.getElementById('stack-view'), outputBox = document.getElementById('output-box'), statusInd = document.getElementById('status-indicator'), inputField = document.getElementById('input-field'), btnSubmitInput = document.getElementById('btn-submit-input'), btnInit = document.getElementById('btn-init'), btnRun = document.getElementById('btn-run'), btnStep = document.getElementById('btn-step'), btnStop = document.getElementById('btn-stop');

        function createGrid() { gridContainer.innerHTML = ''; for (let y = 0; y < ROWS; y++) { let row = document.createElement('div'); row.className = 'grid-row'; for (let x = 0; x < COLS; x++) { let cell = document.createElement('div'); cell.className = 'grid-cell'; cell.id = `cell-${x}-${y}`; row.appendChild(cell); } gridContainer.appendChild(row); } }
        function updateUI() { document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight')); const activeCell = document.getElementById(`cell-${pc.x}-${pc.y}`); if (activeCell) activeCell.classList.add('highlight'); stackView.innerHTML = stack.map(item => `<div class="stack-item">${item}</div>`).join(''); }
        function loadProgram() { const lines = sourceCode.value.split('\n'); for (let y = 0; y < ROWS; y++) { grid[y] = []; let rowText = (lines[y] || "").padEnd(COLS, " "); for (let x = 0; x < COLS; x++) { grid[y][x] = rowText[x]; document.getElementById(`cell-${x}-${y}`).textContent = grid[y][x]; } } }
        function setControls(isRunning) { btnInit.disabled = isRunning; btnRun.disabled = isRunning; btnStep.disabled = isRunning; btnStop.disabled = !isRunning; sourceCode.disabled = isRunning; statusInd.innerText = isRunning ? "RUNNING..." : "IDLE"; statusInd.className = isRunning ? "text-green-400 animate-pulse" : "text-gray-500"; }
        function pop() { return stack.pop() || 0; }
        function push(val) { stack.push(val); }
        function move() { pc.x = (pc.x + dir.x + COLS) % COLS; pc.y = (pc.y + dir.y + ROWS) % ROWS; }
        function waitForInput(type) { running = false; clearInterval(intervalId); pendingInputType = type; statusInd.innerText = type === 'number' ? "WAITING FOR NUMBER..." : "WAITING FOR CHAR..."; statusInd.className = "text-yellow-400 font-bold animate-bounce"; inputField.disabled = false; btnSubmitInput.disabled = false; inputField.placeholder = type === 'number' ? "Enter number & hit Enter" : "Enter char & hit Enter"; inputField.focus(); }
        function resolveInput() { const raw = inputField.value.trim(); if (!raw && pendingInputType === 'number') return; if (pendingInputType === 'number') { const num = parseInt(raw); push(isNaN(num) ? 0 : num); } else { push(raw ? raw.charCodeAt(0) : 0); } inputField.value = ""; inputField.disabled = true; btnSubmitInput.disabled = true; inputField.placeholder = "Type number/char here..."; pendingInputType = null; move(); updateUI(); if (executionMode === 'auto') { running = true; setControls(true); intervalId = setInterval(step, delay); } else { statusInd.innerText = "PAUSED (STEP)"; statusInd.className = "text-yellow-500 font-bold"; btnInit.disabled = true; btnRun.disabled = false; btnStep.disabled = false; btnStop.disabled = false; } }
        inputField.addEventListener("keydown", function(event) { if (event.key === "Enter") resolveInput(); });
        function step() {
            const cmd = grid[pc.y][pc.x];
            if (stringMode) { if (cmd === '"') stringMode = false; else push(cmd.charCodeAt(0)); } else if (cmd >= '0' && cmd <= '9') { push(parseInt(cmd)); } else {
                switch (cmd) { case '+': push(pop() + pop()); break; case '-': { let a = pop(), b = pop(); push(b - a); } break; case '*': push(pop() * pop()); break; case '/': { let a = pop(), b = pop(); push(b === 0 ? 0 : Math.floor(a / b)); } break; case '%': { let a = pop(), b = pop(); push(b === 0 ? 0 : b % a); } break; case '!': push(pop() === 0 ? 1 : 0); break; case '`': { let a = pop(), b = pop(); push(b > a ? 1 : 0); } break; case '>': dir = { x: 1, y: 0 }; break; case '<': dir = { x: -1, y: 0 }; break; case '^': dir = { x: 0, y: -1 }; break; case 'v': dir = { x: 0, y: 1 }; break; case '?': { const dirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:-1}, {x:0,y:1}]; dir = dirs[Math.floor(Math.random() * 4)]; } break; case '_': dir = pop() === 0 ? { x: 1, y: 0 } : { x: -1, y: 0 }; break; case '|': dir = pop() === 0 ? { x: 0, y: 1 } : { x: 0, y: -1 }; break; case '"': stringMode = true; break; case ':': { let a = pop(); push(a); push(a); } break; case '\\': { let a = pop(), b = pop(); push(a); push(b); } break; case '$': pop(); break; case '.': outputBox.value += pop() + " "; break; case ',': outputBox.value += String.fromCharCode(pop()); break; case '#': move(); break; case 'g': { let y = pop(), x = pop(); push(grid[y][x].charCodeAt(0)); } break; case 'p': { let y = pop(), x = pop(), v = pop(); grid[y][x] = String.fromCharCode(v); document.getElementById(`cell-${x}-${y}`).textContent = String.fromCharCode(v); } break; case '&': waitForInput('number'); return; case '~': waitForInput('char'); return; case '@': stop(); return; }
            } move(); updateUI();
        }
        function run() { if (running) return; executionMode = 'auto'; running = true; setControls(true); intervalId = setInterval(step, delay); }
        function manualStep() { executionMode = 'manual'; step(); }
        function stop() { if (!running && executionMode !== 'manual') return; running = false; clearInterval(intervalId); setControls(false); updateUI(); }
        btnInit.addEventListener('click', () => { loadProgram(); pc = { x: 0, y: 0 }; dir = { x: 1, y: 0 }; stack = []; stringMode = false; outputBox.value = ''; inputField.disabled = true; btnSubmitInput.disabled = true; updateUI(); btnRun.disabled = false; btnStep.disabled = false; btnStop.disabled = true; sourceCode.disabled = false; statusInd.innerText = "READY"; statusInd.className = "text-blue-400"; });
        btnRun.addEventListener('click', run); btnStep.addEventListener('click', manualStep); btnStop.addEventListener('click', stop);
        createGrid(); loadProgram(); btnRun.disabled = false; btnStep.disabled = false; btnStop.disabled = true;
    </script>
</body>
</html>
